name: codecov
permissions: read-all
on:
  push:
    branches: main
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: main

jobs:
  run:
    runs-on: ubuntu-24.04 # Python 3.11.5 is unavailable on Ubuntu 26.04.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11.5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11.5
      - name: install poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 1.4.1
      - name: Install dependencies
        run: poetry install --with test
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run tests and collect coverage
        run: poetry run pytest --cov-report term --cov-report xml:coverage.xml --cov=src
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
